name: Carrier validation

# Reusable baseline for every ha-<carrier> integration. Runs in the caller's
# context: checkout, HACS and hassfest all see the carrier repository, so each
# carrier keeps its own HACS/hassfest checks in its own Actions tab.

on:
  workflow_call:
    inputs:
      domain:
        description: Integration domain, e.g. gls or dhl_nl.
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.13"
      coverage-threshold:
        required: false
        type: number
        default: 95

permissions:
  contents: read

jobs:
  hacs:
    name: Validate with HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: >-
          python -m pytest tests/
          --cov=custom_components.${{ inputs.domain }}
          --cov-fail-under=${{ inputs.coverage-threshold }} -v

  ruff:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ruff
        uses: astral-sh/ruff-action@v4.1.0

  translations:
    name: Validate translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carrier repository
        uses: actions/checkout@v7

      - name: Checkout suite scripts
        uses: actions/checkout@v7
        with:
          repository: ha-parcel-integrations/.github
          path: .suite

      - name: Compare translation structures
        run: >-
          python .suite/.github/scripts/check_translations.py
          custom_components/${{ inputs.domain }}/translations

  policy:
    name: Check suite policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carrier repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout suite scripts
        uses: actions/checkout@v7
        with:
          repository: ha-parcel-integrations/.github
          path: .suite

      - name: Check repository policy
        env:
          DOMAIN: ${{ inputs.domain }}
        run: python .suite/.github/scripts/check_policy.py

      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "No pushed commit range to validate."
            exit 0
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            commit_range="$BASE_SHA..$PR_HEAD_SHA"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A force-push orphans the previous tip, so it is not fetched and
            # BEFORE..HEAD cannot resolve. Fall back to everything since the
            # last release, which is exactly the range that was rewritten.
            last_tag=$(git tag --list --sort=-v:refname \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -n "$last_tag" ]; then
              commit_range="$last_tag..$HEAD_SHA"
            else
              commit_range="$HEAD_SHA^..$HEAD_SHA"
            fi
          else
            commit_range="$BEFORE..$HEAD_SHA"
          fi
          python .suite/.github/scripts/check_commit_messages.py "$commit_range"
