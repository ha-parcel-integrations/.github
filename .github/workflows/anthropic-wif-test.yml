name: Anthropic WIF test

# Throwaway workflow to verify Workload Identity Federation is wired up
# correctly before it's used in the real release pipeline. Delete once
# confirmed working.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01VgUFSQbCJ1D7o4SwoK1MPo
      ANTHROPIC_ORGANIZATION_ID: f65f4e75-a0fc-404d-82aa-2d494a471042
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01LcoHxucYj1ar67gXPmJB7F
      ANTHROPIC_WORKSPACE_ID: wrkspc_019hYCFKV6dbqwVy5WyjWbtg
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Exchange for an Anthropic access token
        run: |
          RESPONSE=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "$ANTHROPIC_FEDERATION_RULE_ID",
            "organization_id": "$ANTHROPIC_ORGANIZATION_ID",
            "service_account_id": "$ANTHROPIC_SERVICE_ACCOUNT_ID",
            "workspace_id": "$ANTHROPIC_WORKSPACE_ID"
          }
          JSON
          )
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          if [ -n "$ACCESS_TOKEN" ]; then
            echo "::add-mask::$ACCESS_TOKEN"
            echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          fi
          echo "$RESPONSE" | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          case "$ACCESS_TOKEN" in
            sk-ant-oat01-*) echo "Exchange OK: got a scoped access token." ;;
            *) echo "Exchange FAILED - see redacted response above." >&2; exit 1 ;;
          esac

      - name: Call the Messages API
        run: |
          curl -sS https://api.anthropic.com/v1/messages \
            -H "authorization: Bearer $ACCESS_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-sonnet-5","max_tokens":64,"messages":[{"role":"user","content":"Reply with exactly: WIF OK"}]}' \
          | jq -r '.content[] | select(.type=="text") | .text'
