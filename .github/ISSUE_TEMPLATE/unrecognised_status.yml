name: 🏷️ Unrecognised parcel status
description: An integration logged a warning asking you to report an unrecognised status or event.
title: "[status] "
labels: ["unrecognised-status"]
body:
  - type: markdown
    attributes:
      value: |
        The integration logs a line such as
        `[parcel] statusPhase.message=… → reported as 'unknown'` or
        `[history] observationCode=… / eventType=…`.
        Paste that full line below and we'll add it to the mapping.
  - type: dropdown
    id: integration
    attributes:
      label: Which integration?
      options:
        - DHL
        - PostNL
        - DPD
        - GLS
        - Dragonfly
        - Other
    validations:
      required: true
  - type: textarea
    id: logline
    attributes:
      label: The log line
      description: Copy the full "help us map it" warning line from your Home Assistant log.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: e.g. 4.5.0
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.7.0
  - type: markdown
    attributes:
      value: |
        ### 💡 Even better: attach a diagnostics file

        A diagnostics download shows us the exact payload behind the warning —
        usually all we need to fix the mapping, with no back-and-forth.

        1. In Home Assistant, open **Settings → Devices & services**.
        2. Open the integration that logged the warning, then click the **⋮**
           (three dots) on its entry.
        3. Choose **Download diagnostics**.
        4. Drag the downloaded file onto this issue to attach it.

        Home Assistant redacts the file before download — names, addresses and
        tracking numbers are removed, while the status codes we need are kept.
